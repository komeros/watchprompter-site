  const supportedLanguages = ["en", "tr", "de", "fr", "es"];

  const languageSelect = document.getElementById("language-select");
  const content = document.getElementById("content");
  const metaDescription = document.getElementById("meta-description");


  function getUrlLanguage() {
    const params = new URLSearchParams(window.location.search);
    const lang = params.get("lang");

    if (lang && supportedLanguages.includes(lang.toLowerCase())) {
      return lang.toLowerCase();
    }

    return null;
  }


  function getStoredLanguage() {
    try {
      const lang = localStorage.getItem("watchprompter-language");

      if (lang && supportedLanguages.includes(lang)) {
        return lang;
      }
    } catch (error) {
      // localStorage may be unavailable.
    }

    return null;
  }


  function getBrowserLanguage() {
    const browserLanguages =
      navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language];

    for (const language of browserLanguages) {
      if (!language) continue;

      const code = language.toLowerCase().split("-")[0];

      if (supportedLanguages.includes(code)) {
        return code;
      }
    }

    return "en";
  }


  function getInitialLanguage() {
    return (
      getUrlLanguage() ||
      getStoredLanguage() ||
      getBrowserLanguage() ||
      "en"
    );
  }


  function renderLanguage(lang) {
    const t = translations[lang] || translations.en;

    document.documentElement.lang = lang;
    document.title = t.documentTitle;
    metaDescription.setAttribute("content", t.metaDescription);

    languageSelect.value = lang;
    languageSelect.setAttribute("aria-label", t.languageLabel);

    const sectionsHTML = t.sections
      .map(
        section => `
          <h2>${section.title}</h2>
          <p>${section.text}</p>
        `
      )
      .join("");

    content.innerHTML = `
      <h1>${t.title}</h1>

      <p>
        <strong>${t.updated}</strong>
      </p>

      <p>${t.intro}</p>

      ${sectionsHTML}

      <h2>${t.contactTitle}</h2>

      <p>
        <strong>${t.developer}</strong><br>
        <a href="mailto:omerkeskintr@icloud.com">
          omerkeskintr@icloud.com
        </a>
      </p>
    `;
  }


  languageSelect.addEventListener("change", function () {
    const lang = this.value;

    try {
      localStorage.setItem("watchprompter-language", lang);
    } catch (error) {
      // Continue normally if localStorage is unavailable.
    }

    renderLanguage(lang);
  });


  renderLanguage(getInitialLanguage());
</script>
