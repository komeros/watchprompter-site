<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>WatchPrompter Support</title>

  <meta
    id="meta-description"
    name="description"
    content="Support for WatchPrompter on iPhone and Apple Watch"
  >

  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
      background: Canvas;
      color: CanvasText;
    }

    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 22px 72px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    h2 {
      margin-top: 32px;
      font-size: 1.25rem;
    }

    .card {
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      border-radius: 16px;
      padding: 20px;
      margin: 20px 0;
    }

    a {
      color: #0a66c2;
    }

    .muted {
      opacity: 0.7;
    }

    .language-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 28px;
    }

    .language-select {
      font: inherit;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
      background: Canvas;
      color: CanvasText;
      cursor: pointer;
    }

    .language-select:focus {
      outline: 2px solid #0a66c2;
      outline-offset: 2px;
    }
  </style>
</head>

<body>
<main>

  <div class="language-bar">
    <select
      id="language-select"
      class="language-select"
      aria-label="Language"
    >
      <option value="en">English</option>
      <option value="tr">Türkçe</option>
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
    </select>
  </div>

  <div id="content"></div>

</main>

<script>
  const translations = {

      watchTitle: "Apple Watch bağlantısı:",
      watchText:

      speechTitle: "Ses takibi çalışmıyorsa:",
      speechText:
        "iPhone Ayarları üzerinden Mikrofon ve Konuşma Tanıma izinlerinin WatchPrompter için açık olduğunu kontrol edin.",

        "Kamera, Mikrofon ve Fotoğraflar izinlerinin etkin olduğundan emin olun.",

      watchText:
        "Assurez-vous que votre iPhone et votre Apple Watch sont jumelés et que WatchPrompter est installé sur votre Apple Watch.",

      speechText:
        "Dans les réglages de l’iPhone, vérifiez que WatchPrompter dispose des autorisations pour le microphone et la reconnaissance vocale.",

      cameraTitle: "La caméra ou l’enregistrement vidéo ne fonctionne pas :",

        "Assurez-vous que les autorisations pour la caméra, le microphone et Photos sont activées.",

        "Assurez-vous que l’appareil audio est connecté à l’iPhone, puis sélectionnez à nouveau l’entrée appropriée dans la section des sources audio.",

      sendTitle: "Impossible d’envoyer le texte vers l’Apple Watch :",

        "Assurez-vous que l’iPhone et l’Apple Watch peuvent communiquer entre eux. Si nécessaire, rouvrez WatchPrompter sur les deux appareils.",

      privacyTitle: "Confidentialité",

    },

    es: {
      documentTitle: "Soporte de WatchPrompter",
      metaDescription: "Soporte para WatchPrompter en iPhone y Apple Watch",
      languageLabel: "Idioma",

      title: "Soporte de WatchPrompter",
      subtitle: "Soporte del teleprompter para iPhone y Apple Watch",

      contactTitle: "Contactar con soporte",
      contactText:
        "Para preguntas, informes de errores o comentarios sobre WatchPrompter:",
      emailLabel: "Correo electrónico:",

      issuesTitle: "Problemas frecuentes",

      watchTitle: "Conexión con Apple Watch:",
      watchText:
        "Asegúrate de que tu iPhone y Apple Watch estén enlazados y de que WatchPrompter esté instalado en tu Apple Watch.",

      speechTitle: "El seguimiento de voz no funciona:",
      speechText:
        "Comprueba en los Ajustes del iPhone que WatchPrompter tenga permisos para acceder al micrófono y al reconocimiento de voz.",

      cameraTitle: "La cámara o la grabación de vídeo no funcionan:",
      cameraText:
        "Asegúrate de que los permisos de Cámara, Micrófono y Fotos estén activados.",

      audioTitle: "Los AirPods o la fuente de audio no aparecen:",
      audioText:
        "Asegúrate de que el dispositivo de audio esté conectado al iPhone y vuelve a seleccionar la entrada adecuada en la sección de fuentes de audio.",

      sendTitle: "No se puede enviar el texto al Apple Watch:",
      sendText:
        "Asegúrate de que el iPhone y el Apple Watch puedan comunicarse entre sí. Si es necesario, vuelve a abrir WatchPrompter en ambos dispositivos.",

      privacyTitle: "Privacidad",
      privacyText: "Consulta la política de privacidad de WatchPrompter:",
      privacyLink: "Política de privacidad"
    }
  };


  const supportedLanguages = ["en", "tr", "de", "fr", "es"];

  const languageSelect = document.getElementById("language-select");
  const content = document.getElementById("content");
  const metaDescription = document.getElementById("meta-description");


  function getUrlLanguage() {
    const params = new URLSearchParams(window.location.search);
    const lang = params.get("lang");

    if (lang && supportedLanguages.includes(lang.toLowerCase())) {
      return lang.toLowerCase();
    }

    return null;
  }


  function getStoredLanguage() {
    try {
      const lang = localStorage.getItem("watchprompter-support-language");

      if (lang && supportedLanguages.includes(lang)) {
        return lang;
      }
    } catch (error) {
      // localStorage may be unavailable in some browsing modes.
    }

    return null;
  }


  function getBrowserLanguage() {
    const browserLanguages =
      navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language];

    for (const language of browserLanguages) {
      if (!language) continue;

      const code = language.toLowerCase().split("-")[0];

      if (supportedLanguages.includes(code)) {
        return code;
      }
    }

    return "en";
  }


  function getInitialLanguage() {
    return (
      getUrlLanguage() ||
      getStoredLanguage() ||
      getBrowserLanguage() ||
      "en"
    );
  }


  function renderLanguage(lang) {
    const t = translations[lang] || translations.en;

    document.documentElement.lang = lang;
    document.title = t.documentTitle;
    metaDescription.setAttribute("content", t.metaDescription);

    languageSelect.value = lang;
    languageSelect.setAttribute("aria-label", t.languageLabel);

    content.innerHTML = `
      <h1>${t.title}</h1>
      <p class="muted">${t.subtitle}</p>

      <div class="card">
        <h2>${t.contactTitle}</h2>

        <p>${t.contactText}</p>

        <p>
          <strong>${t.emailLabel}</strong>
          <a href="mailto:omerkeskintr@icloud.com">
            omerkeskintr@icloud.com
          </a>
        </p>
      </div>

      <h2>${t.issuesTitle}</h2>

      <p>
        <strong>${t.watchTitle}</strong><br>
        ${t.watchText}
      </p>

      <p>
        <strong>${t.speechTitle}</strong><br>
        ${t.speechText}
      </p>

      <p>
        <strong>${t.cameraTitle}</strong><br>
        ${t.cameraText}
      </p>

      <p>
        <strong>${t.audioTitle}</strong><br>
        ${t.audioText}
      </p>

      <p>
        <strong>${t.sendTitle}</strong><br>
        ${t.sendText}
      </p>

      <h2>${t.privacyTitle}</h2>

      <p>
        ${t.privacyText}
        <a href="privacy.html">${t.privacyLink}</a>
      </p>
    `;
  }


  languageSelect.addEventListener("change", function () {
    const lang = this.value;

    try {
      localStorage.setItem(
        "watchprompter-support-language",
        lang
      );
    } catch (error) {
      // Continue normally if localStorage is unavailable.
    }

    renderLanguage(lang);
  });


  renderLanguage(getInitialLanguage());
</script>

</body>
</html>
